name: CI

# Vets and tests every push and pull request on each OS a release is built
# for. The Keychain, codesign and hdiutil tests only run on macOS; the rest
# runs everywhere so a Linux or Windows break shows up before a tag.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # Same packages the release build installs: Fyne needs OpenGL and X11
      # headers on Linux, and the tray uses libayatana-appindicator.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libayatana-appindicator3-dev
      - run: go vet ./...
      - run: go test ./...

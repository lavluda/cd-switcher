name: Release

# Builds native binaries for each OS and attaches them to the GitHub release.
#
# CD-Switcher uses Fyne (OpenGL + cgo), so every binary must be built ON its
# target OS with a C toolchain — there is no cross-compile path between OSes. We
# build on a matrix of native runners and upload each artifact to the release for
# the tag that triggered the run.
#
# macOS ships as a .dmg containing a universal (arm64 + amd64) .app bundle:
# clang's universal SDK lets us compile each arch with `-arch` cgo flags and
# `lipo` them together, so a single artifact covers Apple Silicon and Intel
# without depending on the scarce macos-13 (Intel) runners.

on:
  push:
    tags:
      - "v*"
  # Allow attaching binaries to an existing tag/release (e.g. v0.1.0) manually.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-universal
            runner: macos-14
            ext: ".dmg"
          - name: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            ext: ""
          - name: windows-amd64
            runner: windows-latest
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Fyne needs OpenGL + X11 development headers to build on Linux; the tray
      # uses libayatana-appindicator.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libayatana-appindicator3-dev

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No Developer ID certificate configured; the dmg stays ad-hoc signed."
            exit 0
          fi
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/build.keychain"
          identity=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$identity" ]; then
            echo "Certificate imported but no Developer ID Application identity was found." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # macOS: build each arch with clang cross-arch cgo flags, lipo into a
      # universal binary, wrap it in a code-signed .app (menu-bar agent), and
      # package a drag-to-Applications .dmg.
      - name: Build & package (macOS)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "1"
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          CGO_CFLAGS="-arch arm64" CGO_LDFLAGS="-arch arm64" GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o cd-switcher-arm64 .
          CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o cd-switcher-amd64 .
          lipo -create -output cd-switcher cd-switcher-arm64 cd-switcher-amd64
          lipo -info cd-switcher

          # App icon: generated in code, rendered to an .icns at multiple sizes.
          go run ./cmd/genicon icon.png
          mkdir icon.iconset
          gen() { sips -z "$1" "$1" icon.png --out "icon.iconset/$2" >/dev/null 2>&1; }
          gen 16 icon_16x16.png;     gen 32 icon_16x16@2x.png
          gen 32 icon_32x32.png;     gen 64 icon_32x32@2x.png
          gen 128 icon_128x128.png;  gen 256 icon_128x128@2x.png
          gen 256 icon_256x256.png;  gen 512 icon_256x256@2x.png
          gen 512 icon_512x512.png;  gen 1024 icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

          APP="CD-Switcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp cd-switcher "$APP/Contents/MacOS/cd-switcher"
          chmod +x "$APP/Contents/MacOS/cd-switcher"
          cp icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>CD-Switcher</string>
            <key>CFBundleDisplayName</key><string>CD-Switcher</string>
            <key>CFBundleIdentifier</key><string>com.lavluda.cd-switcher</string>
            <key>CFBundleExecutable</key><string>cd-switcher</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ github.event.inputs.tag || github.ref_name }}</string>
            <key>CFBundleVersion</key><string>${{ github.event.inputs.tag || github.ref_name }}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          # Developer ID when a signing identity was imported for this run.
          # Otherwise an ad-hoc signature, which still runs on Apple Silicon
          # but Gatekeeper treats the download as unnotarized.
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$APP/Contents/MacOS/cd-switcher"
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          else
            codesign --force --sign - "$APP/Contents/MacOS/cd-switcher"
            codesign --force --sign - "$APP"
          fi
          codesign --verify --verbose=2 "$APP"

          mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "CD-Switcher" -srcfolder dmgroot -ov -format UDZO \
            "cd-switcher-${{ matrix.name }}${{ matrix.ext }}"

      - name: Notarize disk image
        if: runner.os == 'macOS'
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEY_B64: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY_B64" ]; then
            echo "No notary credentials configured; skipping notarization."
            exit 0
          fi
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          dmg="cd-switcher-darwin-universal.dmg"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Build
        if: runner.os != 'macOS'
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        # The version goes in via a GitHub Actions expression, not a shell
        # variable: this step runs under bash on Linux but pwsh on Windows,
        # and "$TAG" only expands in one of those.
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.event.inputs.tag || github.ref_name }}" -o "cd-switcher-${{ matrix.name }}${{ matrix.ext }}" .

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: cd-switcher-${{ matrix.name }}${{ matrix.ext }}
          fail_on_unmatched_files: true

      # Same tap k8s-pods-viewer publishes to. TAP_GITHUB_TOKEN needs contents
      # write on lavluda/homebrew-tap.
      - name: Publish Homebrew cask
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "TAP_GITHUB_TOKEN is not set; cannot update lavluda/homebrew-tap" >&2
            exit 1
          fi
          version="${TAG#v}"
          dmg="cd-switcher-${{ matrix.name }}${{ matrix.ext }}"
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')

          git clone --depth 1 https://github.com/lavluda/homebrew-tap.git "$RUNNER_TEMP/homebrew-tap"
          cask="$RUNNER_TEMP/homebrew-tap/Casks/cd-switcher.rb"
          sed -i '' "s/^  version \".*\"/  version \"${version}\"/" "$cask"
          sed -i '' "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" "$cask"

          git -C "$RUNNER_TEMP/homebrew-tap" config user.name "S M Ibrahim"
          git -C "$RUNNER_TEMP/homebrew-tap" config user.email "smibrahim@gmail.com"
          git -C "$RUNNER_TEMP/homebrew-tap" add Casks/cd-switcher.rb
          if git -C "$RUNNER_TEMP/homebrew-tap" diff --cached --quiet; then
            echo "Homebrew cask already at ${TAG}"
            exit 0
          fi
          git -C "$RUNNER_TEMP/homebrew-tap" commit -m "Brew cask update for cd-switcher version ${TAG}"
          gh auth setup-git
          git -C "$RUNNER_TEMP/homebrew-tap" push origin HEAD
